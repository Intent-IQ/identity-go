hooks:
  enabled: true
  modules:
    intentiq:
      identity:
        enabled: true
        partner_id: example-partner
        api_endpoint: https://api.intentiq.com/profiles_engine/ProfilesEngineServlet
        reports_endpoint: https://reports.intentiq.com/report
        timeout: 1500 # milliseconds

        # How long the auction waits for enrichment. Omit this key, or set it
        # greater than or equal to timeout, to preserve synchronous behavior.
        # Set it to 0 for cache-warming-only async behavior, or between 0 and
        # timeout for hybrid behavior. Async/hybrid requires cache.enabled.
        # wait_timeout: 700

        # Module-instance cap for S2S calls that may outlive their auction wait.
        # Required when wait_timeout is less than timeout. Account configuration
        # cannot override it.
        max_concurrent_calls: 2000

        metrics_enabled: true
        metrics_port: 9091

        cache:
          enabled: true
          provider: valkey # valkey, redis, or aerospike
          ttl_seconds: 43200
          max_keys: 10
          max_size: 100000
          ttl_ceiling_first_party_seconds: 86400
          ttl_ceiling_third_party_seconds: 43200
          ttl_ceiling_device_seconds: 3600
          negative_ttl_seconds: 120

        valkey:
          host: 127.0.0.1
          port: 6379
          password: ""
          connect_timeout_ms: 5000

        redis:
          host: 127.0.0.1
          port: 6379
          password: ""
          connect_timeout_ms: 5000

        aerospike:
          host: 127.0.0.1
          port: 3000
          namespace: test
          set: identity
          client_policy:
            connection_queue_size: 1024
            min_connections_per_node: 3
            connect_timeout_ms: 5000
            idle_timeout_ms: 0

  host_execution_plan:
    endpoints:
      /openrtb2/auction:
        stages:
          processed_auction_request:
            # Group timeouts must stay above the module's own timeout (1000 above).
            # Prebid Server stops waiting here and discards the hook result, so a
            # group timeout equal to the module timeout races the module's own
            # fail-open path and throws away enrichment that did arrive.
            groups:
              - timeout: 2000
                hook_sequence:
                  - module_code: intentiq.identity
                    hook_impl_code: HandleProcessedAuctionHook
          auction_response:
            groups:
              - timeout: 2000
                hook_sequence:
                  - module_code: intentiq.identity
                    hook_impl_code: HandleAuctionResponseHook
