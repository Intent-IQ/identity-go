name: Unit tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "integrations/**/v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go 1.26.9 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.9
          cache-dependency-path: |
            go.sum
            cmd/benchmark/go.sum
            example/basic/go.sum
            example/prebid-module/go.sum
            integrations/aerospike/go.sum
            integrations/prometheus/go.sum
            integrations/redis/go.sum
            integrations/valkey/go.sum

      - name: Check release version
        run: scripts/check-version.sh

      - name: Run complete validation
        run: make check

      - name: Build basic example
        run: make build-basic
